name: Cross Platform

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  desktop:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libwebkit2gtk-4.1-dev \
            pkg-config

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun test

      - name: Build desktop app
        run: bun run build

      - name: Upload desktop build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: nyxen-minecraft-${{ runner.os }}
          path: build
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: desktop
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: nyxen-minecraft-*

      - name: Prepare release assets
        id: release
        shell: bash
        run: |
          set -euo pipefail

          short_sha="${GITHUB_SHA::7}"
          tag="build-${GITHUB_RUN_NUMBER}-${short_sha}"
          title="Nyxen Minecraft build ${GITHUB_RUN_NUMBER} (${short_sha})"

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "title=${title}" >> "${GITHUB_OUTPUT}"

          mkdir -p release-assets

          while IFS= read -r artifact_dir; do
            artifact_name="$(basename "${artifact_dir}")"
            tar -czf "release-assets/${artifact_name}.tar.gz" -C "${artifact_dir}" .
          done < <(find release-artifacts -mindepth 1 -maxdepth 1 -type d | sort)

          shopt -s nullglob
          assets=(release-assets/*.tar.gz)
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No release assets were created." >&2
            exit 1
          fi

          ls -lh release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${{ steps.release.outputs.tag }}" release-assets/*.tar.gz \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "${{ steps.release.outputs.title }}" \
            --notes "Automated desktop build from commit ${GITHUB_SHA}." \
            --latest
